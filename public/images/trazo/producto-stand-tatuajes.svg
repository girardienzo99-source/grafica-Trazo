      <text x="77" y="115" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#18181B">APLICACIÓN</text>
      <text x="77" y="135" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#334155">EN SEGUNDOS</text>
      <text x="77" y="162" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#52525B">Diversión asegurada</text>
