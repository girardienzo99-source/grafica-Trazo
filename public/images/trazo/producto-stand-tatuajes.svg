      <stop offset="100%" stop-color="#27272A"/>
    </linearGradient>
    <filter id="shTat" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
