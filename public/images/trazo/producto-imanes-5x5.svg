      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#18181B" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgIman)"/>
  <circle cx="680" cy="110" r="140" fill="#E2E8F0" fill-opacity="0.65"/>
