    <rect x="16" y="16" width="188" height="152" rx="12" fill="#F1F5F9"/>
    <path d="M110 128 C110 128, 68 98, 68 72 C68 56, 82 46, 96 54 C104 59, 110 66, 110 66 C110 66, 116 59, 124 54 C138 46, 152 56, 152 72 C152 98, 110 128, 110 128 Z" fill="#475569"/>
