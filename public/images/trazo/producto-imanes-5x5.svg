  </g>
  <g filter="url(#shadow)" transform="translate(415, 65) rotate(2.5)">
    <rect width="230" height="230" rx="22" fill="#FFFFFF" stroke="#18181B" stroke-width="4"/>
    <rect x="16" y="16" width="198" height="162" rx="12" fill="#F8FAFC"/>
    <circle cx="80" cy="65" r="22" fill="#E2E8F0"/>
    <path d="M25 165 L85 95 L135 145 L165 115 L205 165 Z" fill="#64748B"/>
    <text x="115" y="206" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#18181B">TUS VIAJES Y RECUERDOS</text>
    <rect x="145" y="24" width="60" height="22" rx="6" fill="#18181B"/>
    <text x="175" y="39" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="11" fill="#FFFFFF">5 × 5 cm</text>
  </g>
