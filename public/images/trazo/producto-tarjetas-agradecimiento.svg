<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgPack" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shPack" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#18181B" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgPack)"/>
  <circle cx="650" cy="480" r="150" fill="#E2E8F0" fill-opacity="0.65"/>
  <!-- Main Thank You Card -->
  <g filter="url(#shPack)" transform="translate(120, 110) rotate(-3)">
    <rect width="420" height="290" rx="24" fill="#FFFFFF" stroke="#18181B" stroke-width="4"/>
    <rect x="28" y="28" width="180" height="28" rx="14" fill="#F1F5F9"/>
    <text x="118" y="47" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#18181B">PACKAGING CON IDENTIDAD</text>
    <text x="40" y="110" font-family="sans-serif" font-weight="900" font-size="32" fill="#18181B">¡Gracias por tu compra!</text>
    <text x="40" y="148" font-family="sans-serif" font-weight="600" font-size="15" fill="#52525B">Cada pedido está preparado a mano con dedicación.</text>
    <text x="40" y="174" font-family="sans-serif" font-weight="600" font-size="15" fill="#52525B">Subí una historia etiquetándonos para compartirlo 🤍</text>
    <line x1="40" y1="210" x2="380" y2="210" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="40" y="230" width="150" height="34" rx="17" fill="#18181B"/>
    <text x="115" y="252" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">@tu.marca.oficial</text>
    <circle cx="345" cy="245" r="24" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <text x="345" y="252" text-anchor="middle" font-family="sans-serif" font-size="20">🤍</text>
  </g>
  <!-- Secondary care card -->
  <g filter="url(#shPack)" transform="translate(450, 250) rotate(5)">
    <rect width="240" height="250" rx="22" fill="#18181B" stroke="#E2E8F0" stroke-width="3"/>
    <text x="120" y="55" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">CUIDADOS DEL PRODUCTO</text>
    <text x="30" y="100" font-family="sans-serif" font-weight="600" font-size="13" fill="#F8FAFC">✦ Con tu logo y paleta</text>
    <text x="30" y="130" font-family="sans-serif" font-weight="600" font-size="13" fill="#F8FAFC">✦ Código QR a tu tienda</text>
    <text x="30" y="160" font-family="sans-serif" font-weight="600" font-size="13" fill="#F8FAFC">✦ Frases de agradecimiento</text>
    <rect x="30" y="190" width="180" height="34" rx="17" fill="#FFFFFF"/>
    <text x="120" y="212" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#18181B">FIDELIZÁ TUS CLIENTES</text>
  </g>
</svg>
