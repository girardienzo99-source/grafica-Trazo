<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgBox" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shBox" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="5" dy="10" stdDeviation="7" flood-color="#18181B" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bgBox)"/>
  <g filter="url(#shBox)" transform="translate(150, 85)">
    <rect width="500" height="420" rx="30" fill="#F8FAFC" stroke="#18181B" stroke-width="4"/>
    <rect x="24" y="24" width="452" height="372" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 6"/>
    <!-- Items inside Gift Box -->
    <g transform="translate(55, 55) rotate(-4)">
      <rect width="150" height="150" rx="16" fill="#F8FAFC" stroke="#18181B" stroke-width="3"/>
      <text x="75" y="75" text-anchor="middle" font-family="sans-serif" font-size="30">📸</text>
      <text x="75" y="110" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="14" fill="#18181B">IMANES 5×5 CM</text>
      <text x="75" y="130" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="11" fill="#52525B">Con tus fotos</text>
    </g>
    <g transform="translate(245, 55) rotate(3)">
      <rect width="195" height="145" rx="16" fill="#F1F5F9" stroke="#18181B" stroke-width="3"/>
      <text x="97" y="55" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="15" fill="#18181B">TARJETA DEDICATORIA</text>
      <text x="97" y="85" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#3F3F46">Con tu frase o mensaje</text>
      <text x="97" y="108" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="12" fill="#18181B">personalizado 🤍</text>
    </g>
    <g transform="translate(65, 235)">
      <rect width="370" height="125" rx="20" fill="#18181B"/>
      <text x="185" y="48" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">BOX DE REGALO PERSONALIZADA</text>
      <text x="185" y="78" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="13" fill="#E2E8F0">Combiná imanes 5 × 5 cm, pines, stickers y tarjeta</text>
      <text x="185" y="102" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#CBD5E1">Armada a pedido en Río Cuarto · Envíos a todo el país</text>
    </g>
  </g>
</svg>
